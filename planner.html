<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner | StudyFlow</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body class="planner-page">
    <header class="navbar">
        <div class="logo">StudyFlow</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="planner.html">Planner</a>
            <a href="tracker.html">Tracker</a>
        </nav>
    </header>

    <main class="planner-container">
        <h2>Study Planner</h2>

        <form id="task-form" class="card task-form">

            <div class="planner-header">
                <h3>Add New Task</h3>
                <img src="images/study2.png" alt="Study Illustration" class="planner-icon">
            </div>

            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" required>
            </div>
            <div class="form-group">
                <label for="topic">Topic</label>
                <input type="text" id="topic" required>
            </div>
            <div class="form-group-inline">
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label for="duration">Duration (mins)</label>
                    <input type="number" id="duration" min="5" max="360" required>
                </div>
            </div>
            <div class="form-group">
                <label for="priority">Priority</label>
                <select id="priority" required>
                    <option value="High">High</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="Low">Low</option>
                </select>
            </div>
            <button type="submit" id="add-task-btn">Add Task</button>
        </form>
        <!-- Add this BEFORE <section class="task-list-section"> in planner.html -->
        <div class="search-filter card">
            <h3>Filter Tasks</h3>
            <div class="filter-controls">
                <input type="text" id="search-input" placeholder="Search tasks...">
                <select id="filter-priority">
                    <option value="all">All Priorities</option>
                    <option value="High">High Priority</option>
                    <option value="Medium">Medium Priority</option>
                    <option value="Low">Low Priority</option>
                </select>
                <select id="filter-status">
                    <option value="all">All Tasks</option>
                    <option value="today">Due Today</option>
                    <option value="overdue">Overdue</option>
                    <option value="upcoming">Upcoming</option>
                    <option value="pending">Pending</option>
                    <option value="completed">Completed</option>
                </select>
                <button id="clear-filters" class="clear-filters-btn">Clear Filters</button>
            </div>
        </div>
        <section class="task-list-section">
            <h3>Upcoming Tasks (<span id="task-count">0</span>)</h3>
            <div id="task-list" class="task-grid">
            </div>
        </section>
    </main>

    <script src="planner.js"></script>
</body>
<footer style="text-align:center; padding:15px;">
    © 2026 StudyFlow | Academic Planner
</footer>

</html>
